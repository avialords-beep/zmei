<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Slither.io Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a0e1a;

            display: block;

            touch-action: none;

</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
        <div id="score">0</div>
    </div>
    <div id="settings">
        <label>Валюта:</label>
        <select id="currencySelect">
            <option value="VES">VES (Венесуэла)</option>
            <option value="COP">COP (Колумбия)</option>
            <option value="MXN">MXN (Мексика)</option>
            <option value="RM">RM (Малайзия)</option>
            <option value="NONE">Без валюты</option>
        </select>
        <label>Стартовый баланс:</label>
        <input type="number" id="startBalance" value="15000" min="100" max="1000000" step="100">
        <button id="applySettings">Применить</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const WORLD_SIZE = 8000;
        const WORLD_RADIUS = WORLD_SIZE / 2;
        const BASE_SPEED = 250;
        const BOOST_SPEED = 625;
        const TURN_RATE = 5.5;
        const BOOST_MASS_LOSS = 1;
        const BOOST_PELLET_RATE = 0.25;
        const MIN_SEGMENTS = 10;
        const SEGMENT_RADIUS = 21;
        const SEGMENT_SPACING = SEGMENT_RADIUS * 0.4;
        const MAGNET_RANGE = 125;

        let currency = 'VES';
        let startBalance = 15000;
        let player = null;
        let bots = [];
        let foods = [];
        let particles = [];
        let camera = { x: 0, y: 0, scale: 1 };
        let mouse = { x: width / 2, y: height / 2, down: false };
        let touch = { active: false, x: 0, y: 0 };
        let lastTime = performance.now();
        let boostPelletTimer = 0;

        document.getElementById('currencySelect').addEventListener('change', (e) => {
            currency = e.target.value;
            updateScore();
        });

        document.getElementById('applySettings').addEventListener('click', () => {
            startBalance = parseInt(document.getElementById('startBalance').value);
            initGame();
        });

        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        canvas.addEventListener('mousedown', () => { mouse.down = true; });
        canvas.addEventListener('mouseup', () => { mouse.down = false; });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const t = e.touches[0];
            touch.active = true;
            touch.x = t.clientX;
            touch.y = t.clientY;
            mouse.down = true;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (touch.active) {
                const t = e.touches[0];
                touch.x = t.clientX;
                touch.y = t.clientY;
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            mouse.down = false;
        });

        class Snake {
            constructor(x, y, mass, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.angle = Math.random() * Math.PI * 2;
                this.mass = mass;
                this.targetMass = mass;
                this.isPlayer = isPlayer;
                this.segments = [];
                this.speed = BASE_SPEED;
                this.targetSpeed = BASE_SPEED;
                this.boosting = false;
                this.dead = false;
                
                const segmentCount = Math.max(MIN_SEGMENTS, Math.floor(mass / 100));
                for (let i = 0; i < segmentCount; i++) {
                    this.segments.push({
                        x: x - i * (SEGMENT_RADIUS + SEGMENT_SPACING),
                        y: y
                    });
                }

                if (!isPlayer) {
                    this.color = this.randomColor();
                    this.pattern = Math.floor(Math.random() * 3);
                    this.aiType = ['collector', 'hunter', 'aggressive', 'cautious', 'booster'][Math.floor(Math.random() * 5)];
                    this.aiTarget = null;
                    this.aiTimer = 0;
                    this.aiDecisionInterval = 1 + Math.random() * 2;
                } else {
                    this.color = { r: 255, g: 80, b: 80 };
                    this.pattern = 0;
                }
            }

            randomColor() {
                const colors = [
                    { r: 255, g: 100, b: 100 },
                    { r: 100, g: 255, b: 100 },
                    { r: 255, g: 220, b: 100 },
                    { r: 150, g: 100, b: 255 },
                    { r: 255, g: 150, b: 200 },
                    { r: 100, g: 200, b: 255 },
                    { r: 255, g: 150, b: 50 },
                    { r: 50, g: 255, b: 200 }
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            getRadius() {
                return SEGMENT_RADIUS + Math.sqrt(this.mass / 1000) * 2;
            }

            update(dt) {
                if (this.dead) return;

                const massDiff = this.targetMass - this.mass;
                this.mass += massDiff * dt * 2;

                const targetSegments = Math.max(MIN_SEGMENTS, Math.floor(this.mass / 100));
                while (this.segments.length < targetSegments) {
                    const last = this.segments[this.segments.length - 1];
                    this.segments.push({ x: last.x, y: last.y });
                }
                while (this.segments.length > targetSegments && this.segments.length > MIN_SEGMENTS) {
                    this.segments.pop();
                }

                if (!this.isPlayer) {
                    this.updateAI(dt);
                } else {
                    const targetX = touch.active ? touch.x : mouse.x;
                    const targetY = touch.active ? touch.y : mouse.y;
                    const wx = camera.x + (targetX - width / 2) / camera.scale;
                    const wy = camera.y + (targetY - height / 2) / camera.scale;
                    const targetAngle = Math.atan2(wy - this.y, wx - this.x);
                    this.turnTowards(targetAngle, dt);

                    this.boosting = mouse.down && this.mass > 200;
                }

                this.targetSpeed = this.boosting ? BOOST_SPEED : BASE_SPEED;
                const speedDiff = this.targetSpeed - this.speed;
                this.speed += speedDiff * dt * 8;

                if (this.boosting) {
                    this.targetMass -= BOOST_MASS_LOSS * dt;
                    if (this.targetMass < 200) {
                        this.boosting = false;
                        this.targetMass = 200;
                    }

                    if (this.isPlayer) {
                        boostPelletTimer += dt;
                        if (boostPelletTimer >= BOOST_PELLET_RATE) {
                            boostPelletTimer = 0;
                            const tail = this.segments[this.segments.length - 1];
                            foods.push(new Food(tail.x, tail.y, 'boost', 5));
                        }
                    }
                }

                this.x += Math.cos(this.angle) * this.speed * dt;
                this.y += Math.sin(this.angle) * this.speed * dt;

                const distFromCenter = Math.sqrt(this.x * this.x + this.y * this.y);
                if (distFromCenter > WORLD_RADIUS - 100) {
                    const angleToCenter = Math.atan2(-this.y, -this.x);
                    this.turnTowards(angleToCenter, dt * 3);
                }

                const radius = this.getRadius();
                const spacing = radius * 0.4;
                
                this.segments[0].x = this.x;
                this.segments[0].y = this.y;

                for (let i = 1; i < this.segments.length; i++) {
                    const prev = this.segments[i - 1];
                    const curr = this.segments[i];
                    const dx = curr.x - prev.x;
                    const dy = curr.y - prev.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > spacing) {
                        const angle = Math.atan2(dy, dx);
                        curr.x = prev.x + Math.cos(angle) * spacing;
                        curr.y = prev.y + Math.sin(angle) * spacing;
                    }
                }
            }

            turnTowards(targetAngle, dt) {
                let diff = targetAngle - this.angle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                const maxTurn = TURN_RATE * dt;
                if (Math.abs(diff) < maxTurn) {
                    this.angle = targetAngle;
                } else {
                    this.angle += Math.sign(diff) * maxTurn;
                }
            }

            updateAI(dt) {
                this.aiTimer += dt;
                
                if (this.aiTimer >= this.aiDecisionInterval) {
                    this.aiTimer = 0;
                    this.aiDecisionInterval = 1 + Math.random() * 2;
                    this.selectAITarget();
                }

                if (this.aiTarget) {
                    let targetX = this.aiTarget.x;
                    let targetY = this.aiTarget.y;

                    if (this.aiTarget.vx !== undefined) {
                        const predictionTime = 0.5 + Math.random() * 0.7;
                        targetX += this.aiTarget.vx * predictionTime;
                        targetY += this.aiTarget.vy * predictionTime;
                    }

                    const targetAngle = Math.atan2(targetY - this.y, targetX - this.x);
                    this.turnTowards(targetAngle, dt);

                    if (this.aiType === 'booster' || this.aiType === 'aggressive') {
                        const distToTarget = Math.sqrt((targetX - this.x) ** 2 + (targetY - this.y) ** 2);
                        if (distToTarget < 400 && this.mass > 300 && Math.random() < 0.02) {
                            this.boosting = true;
                        } else if (distToTarget > 600) {
                            this.boosting = false;
                        }
                    }
                }

                if (this.aiType === 'cautious') {
                    this.avoidDanger(dt);
                }
            }

            selectAITarget() {
                this.aiTarget = null;

                if (this.aiType === 'collector') {
                    const nearbyFood = foods.filter(f => {
                        const dist = Math.sqrt((f.x - this.x) ** 2 + (f.y - this.y) ** 2);
                        return dist < 600;
                    });
                    if (nearbyFood.length > 0) {
                        this.aiTarget = nearbyFood[Math.floor(Math.random() * nearbyFood.length)];
                    }
                } else if (this.aiType === 'hunter' || this.aiType === 'aggressive') {
                    const enemies = [player, ...bots].filter(s => s && !s.dead && s !== this && s.mass < this.mass * 0.8);
                    if (enemies.length > 0) {
                        const sorted = enemies.sort((a, b) => {
                            const da = Math.sqrt((a.x - this.x) ** 2 + (a.y - this.y) ** 2);
                            const db = Math.sqrt((b.x - this.x) ** 2 + (b.y - this.y) ** 2);
                            return da - db;
                        });
                        const target = sorted[0];
                        const dist = Math.sqrt((target.x - this.x) ** 2 + (target.y - this.y) ** 2);
                        if (dist < 800) {
                            this.aiTarget = {
                                x: target.x,
                                y: target.y,
                                vx: Math.cos(target.angle) * target.speed,
                                vy: Math.sin(target.angle) * target.speed
                            };
                        }
                    }
                }

                if (!this.aiTarget) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 300 + Math.random() * 400;
                    this.aiTarget = {
                        x: this.x + Math.cos(angle) * dist,
                        y: this.y + Math.sin(angle) * dist
                    };
                }
            }

            avoidDanger(dt) {
                const allSnakes = [player, ...bots].filter(s => s && !s.dead && s !== this);
                for (const snake of allSnakes) {
                    for (let i = 3; i < snake.segments.length; i++) {
                        const seg = snake.segments[i];
                        const dist = Math.sqrt((seg.x - this.x) ** 2 + (seg.y - this.y) ** 2);
                        if (dist < 150) {
                            const avoidAngle = Math.atan2(this.y - seg.y, this.x - seg.x);
                            this.turnTowards(avoidAngle, dt * 2);
                            return;
                        }
                    }
                }
            }

            checkCollisions() {
                if (this.dead) return;

                const radius = this.getRadius();
                const allSnakes = [player, ...bots].filter(s => s && !s.dead);

                for (const snake of allSnakes) {
                    if (snake === this) continue;

                    for (let i = 3; i < snake.segments.length; i++) {
                        const seg = snake.segments[i];
                        const dist = Math.sqrt((seg.x - this.x) ** 2 + (seg.y - this.y) ** 2);
                        if (dist < radius + snake.getRadius() * 0.8) {
                            this.die();
                            return;
                        }
                    }
                }
            }

            collectFood() {
                if (this.dead) return;

                const radius = this.getRadius();
                for (let i = foods.length - 1; i >= 0; i--) {
                    const food = foods[i];
                    const dist = Math.sqrt((food.x - this.x) ** 2 + (food.y - this.y) ** 2);
                    
                    if (this.isPlayer && dist < MAGNET_RANGE && food.type !== 'death') {
                        const angle = Math.atan2(this.y - food.y, this.x - food.x);
                        const pullSpeed = 400;
                        food.x += Math.cos(angle) * pullSpeed * (1 / 60);
                        food.y += Math.sin(angle) * pullSpeed * (1 / 60);
                    }

                    if (dist < radius + food.radius) {
                        this.targetMass += food.value;
                        foods.splice(i, 1);
                        if (this.isPlayer) updateScore();
                    }
                }
            }

            die() {
                this.dead = true;

                const orbCount = Math.max(5, Math.floor(this.segments.length / 3));
                const valuePerOrb = this.mass / orbCount;

                for (let i = 0; i < orbCount; i++) {
                    const segIndex = Math.floor((i / orbCount) * this.segments.length);
                    const seg = this.segments[segIndex];
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.random() * 40;
                    
                    foods.push(new Food(
                        seg.x + Math.cos(angle) * dist,
                        seg.y + Math.sin(angle) * dist,
                        'death',
                        valuePerOrb
                    ));
                }

                for (let i = 0; i < 15; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 100 + Math.random() * 150;
                    particles.push({
                        x: this.x,
                        y: this.y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 0.6,
                        maxLife: 0.6,
                        size: 4 + Math.random() * 4,
                        color: this.color
                    });
                }

                if (this.isPlayer) {
                    setTimeout(() => initGame(), 2000);
                }
            }

            draw() {
                if (this.dead) return;

                const radius = this.getRadius();

                for (let i = this.segments.length - 1; i >= 0; i--) {
                    const seg = this.segments[i];
                    
                    const gradient = ctx.createRadialGradient(seg.x, seg.y, 0, seg.x, seg.y, radius);
                    
                    const light = {
                        r: Math.min(255, this.color.r + 50),
                        g: Math.min(255, this.color.g + 50),
                        b: Math.min(255, this.color.b + 50)
                    };
                    const dark = {
                        r: this.color.r * 0.7,
                        g: this.color.g * 0.7,
                        b: this.color.b * 0.7
                    };

                    gradient.addColorStop(0, `rgb(${light.r}, ${light.g}, ${light.b})`);
                    gradient.addColorStop(0.5, `rgb(${this.color.r}, ${this.color.g}, ${this.color.b})`);
                    gradient.addColorStop(1, `rgb(${dark.r}, ${dark.g}, ${dark.b})`);

                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(seg.x, seg.y, radius, 0, Math.PI * 2);
                    ctx.fill();

                    if (this.pattern === 0 && i > 0 && i % 2 === 0) {
                        ctx.strokeStyle = `rgba(${light.r}, ${light.g}, ${light.b}, 0.5)`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        for (let a = 0; a < Math.PI * 2; a += 0.3) {
                            const r = radius * 0.7 + Math.sin(a * 3 + i) * radius * 0.15;
                            const x = seg.x + Math.cos(a) * r;
                            const y = seg.y + Math.sin(a) * r;
                            if (a === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.closePath();
                        ctx.stroke();
                    }
                }

                const head = this.segments[0];
                const eyeOffset = radius * 0.5;
                const eyeSize = radius * 0.35;
                const pupilSize = eyeSize * 0.5;

                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(
                    head.x + Math.cos(this.angle - 0.4) * eyeOffset,
                    head.y + Math.sin(this.angle - 0.4) * eyeOffset,
                    eyeSize, 0, Math.PI * 2
                );
                ctx.fill();

                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(
                    head.x + Math.cos(this.angle - 0.3) * (eyeOffset + pupilSize * 0.3),
                    head.y + Math.sin(this.angle - 0.3) * (eyeOffset + pupilSize * 0.3),
                    pupilSize, 0, Math.PI * 2
                );
                ctx.fill();

                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(
                    head.x + Math.cos(this.angle + 0.4) * eyeOffset,
                    head.y + Math.sin(this.angle + 0.4) * eyeOffset,
                    eyeSize, 0, Math.PI * 2
                );
                ctx.fill();

                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(
                    head.x + Math.cos(this.angle + 0.3) * (eyeOffset + pupilSize * 0.3),
                    head.y + Math.sin(this.angle + 0.3) * (eyeOffset + pupilSize * 0.3),
                    pupilSize, 0, Math.PI * 2
                );
                ctx.fill();
            }

            drawNameplate() {
                if (this.dead) return;

                const screenX = (this.x - camera.x) * camera.scale + width / 2;
                const screenY = (this.y - camera.y) * camera.scale + height / 2;

                if (screenX < -100 || screenX > width + 100 || screenY < -100 || screenY > height + 100) {
                    return;
                }

                const fontSize = this.isPlayer ? 16 : 13;
                ctx.font = `bold ${fontSize}px sans-serif`;
                const text = formatScore(Math.floor(this.mass));
                const metrics = ctx.measureText(text);
                const padding = 8;
                const plateWidth = metrics.width + padding * 2;
                const plateHeight = fontSize + padding;

                const plateX = screenX - plateWidth / 2;
                const plateY = screenY - this.getRadius() * camera.scale - 35;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(plateX, plateY, plateWidth, plateHeight);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.strokeRect(plateX, plateY, plateWidth, plateHeight);

                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 3;
                ctx.strokeText(text, screenX, plateY + plateHeight / 2);
                ctx.fillText(text, screenX, plateY + plateHeight / 2);
            }
        }

        class Food {
            constructor(x, y, type, value) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.value = value;

                if (type === 'small') {
                    this.radius = 8;
                    this.glowRadius = 16;
                    this.color = { r: 255, g: 60, b: 60 };
                } else if (type === 'medium') {
                    this.radius = 14;
                    this.glowRadius = 26;
                    this.color = { r: 255, g: 180, b: 60 };
                } else if (type === 'death') {
                    this.radius = 24;
                    this.glowRadius = 40;
                    this.color = { r: 255, g: 200, b: 80 };
                } else if (type === 'boost') {
                    this.radius = 7;
                    this.glowRadius = 14;
                    this.color = { r: 255, g: 220, b: 120 };
                }
            }

            draw() {
                const glowGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.glowRadius);
                glowGrad.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.8)`);
                glowGrad.addColorStop(0.4, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.3)`);
                glowGrad.addColorStop(1, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0)`);
                
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.glowRadius, 0, Math.PI * 2);
                ctx.fill();

                const coreGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                coreGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
                coreGrad.addColorStop(0.3, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 1)`);
                coreGrad.addColorStop(1, `rgba(${this.color.r * 0.7}, ${this.color.g * 0.7}, ${this.color.b * 0.7}, 0.9)`);
                
                ctx.fillStyle = coreGrad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function formatScore(value) {
            const num = Math.floor(value);
            const formatted = num.toLocaleString('en-US');

            if (currency === 'NONE') {
                return formatted;
            } else if (currency === 'RM') {
                return `${formatted} RM`;
            } else {
                return `${formatted}.00 ${currency}`;
            }
        }

        function updateScore() {
            if (player && !player.dead) {
                document.getElementById('score').textContent = formatScore(player.mass);
            }
        }

        function spawnFood() {
            for (let i = 0; i < 500; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * WORLD_RADIUS * 0.9;
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist;
                foods.push(new Food(x, y, 'small', 1 + Math.random() * 4));
            }

            for (let i = 0; i < 150; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * WORLD_RADIUS * 0.9;
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist;
                foods.push(new Food(x, y, 'medium', 8 + Math.random() * 17));
            }
        }

        function spawnBots() {
            bots = [];
            const botSizes = [
                ...Array(8).fill(300),
                ...Array(10).fill(800),
                ...Array(5).fill(1500),
                ...Array(2).fill(3000)
            ];

            for (const size of botSizes) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * WORLD_RADIUS * 0.8;
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist;
                bots.push(new Snake(x, y, size + Math.random() * 200, false));
            }
        }

        function initGame() {
            foods = [];
            particles = [];
            boostPelletTimer = 0;

            player = new Snake(0, 0, startBalance, true);
            spawnFood();
            spawnBots();
            updateScore();
        }

        function drawStaticHexBackground() {
            const hexSize = 80;
            const hexHeight = hexSize * Math.sqrt(3);
            const hexWidth = hexSize * 2;

            const startX = camera.x - width / camera.scale / 2 - hexWidth;
            const startY = camera.y - height / camera.scale / 2 - hexHeight;
            const endX = camera.x + width / camera.scale / 2 + hexWidth;
            const endY = camera.y + height / camera.scale / 2 + hexHeight;

            ctx.strokeStyle = '#05080f';
            ctx.lineWidth = 8;

            for (let y = startY; y < endY; y += hexHeight * 0.75) {
                for (let x = startX; x < endX; x += hexWidth * 0.75) {
                    const offsetX = (Math.floor(y / (hexHeight * 0.75)) % 2) * (hexWidth * 0.375);
                    const hx = Math.floor((x + offsetX) / (hexWidth * 0.75)) * (hexWidth * 0.75);
                    const hy = Math.floor(y / (hexHeight * 0.75)) * (hexHeight * 0.75);
                    drawHex(hx + offsetX, hy, hexSize);
                }
            }
        }

        function drawHex(cx, cy, size) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i;
                const x = cx + size * Math.cos(angle);
                const y = cy + size * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();

            const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, size);
            gradient.addColorStop(0, '#1e2d4a');
            gradient.addColorStop(0.6, '#14213d');
            gradient.addColorStop(1, '#0f1829');
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.stroke();
        }

        function drawBoundary() {
            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = 20;
            ctx.beginPath();
            ctx.arc(0, 0, WORLD_RADIUS, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawCustomCursor() {
            if (touch.active) return;

            const cursorSize = 16;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            
            ctx.fillStyle = 'rgba(40, 40, 60, 0.5)';
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, cursorSize, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(180, 180, 200, 0.7)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function updateCamera() {
            if (player && !player.dead) {
                camera.x += (player.x - camera.x) * 0.1;
                camera.y += (player.y - camera.y) * 0.1;

                const targetScale = Math.max(0.6, 1 - (player.segments.length - MIN_SEGMENTS) / 500);
                camera.scale += (targetScale - camera.scale) * 0.05;
            }
        }

        function update(dt) {
            if (player && !player.dead) {
                player.update(dt);
                player.checkCollisions();
                player.collectFood();
            }

            for (const bot of bots) {
                bot.update(dt);
                bot.checkCollisions();
                bot.collectFood();
            }

            for (let i = bots.length - 1; i >= 0; i--) {
                if (bots[i].dead) {
                    bots.splice(i, 1);
                    const size = 300 + Math.random() * 1000;
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.random() * WORLD_RADIUS * 0.8;
                    const x = Math.cos(angle) * dist;
                    const y = Math.sin(angle) * dist;
                    bots.push(new Snake(x, y, size, false));
                }
            }

            if (Math.random() < 0.3) {
                if (player && !player.dead) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 400 + Math.random() * 600;
                    const x = player.x + Math.cos(angle) * dist;
                    const y = player.y + Math.sin(angle) * dist;
                    
                    if (Math.sqrt(x * x + y * y) < WORLD_RADIUS - 200) {
                        if (Math.random() < 0.7) {
                            foods.push(new Food(x, y, 'small', 1 + Math.random() * 4));
                        } else {
                            foods.push(new Food(x, y, 'medium', 8 + Math.random() * 17));
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vx *= 0.95;
                p.vy *= 0.95;
                p.life -= dt;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            updateCamera();
        }

        function draw() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            
            const gradient = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, Math.max(width, height));
            gradient.addColorStop(0, '#1a2742');
            gradient.addColorStop(1, '#0a0e1a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            ctx.translate(width / 2, height / 2);
            ctx.scale(camera.scale, camera.scale);
            ctx.translate(-camera.x, -camera.y);

            drawStaticHexBackground();
            drawBoundary();

            const viewDist = (width + height) / camera.scale;
            for (const food of foods) {
                const dist = Math.sqrt((food.x - camera.x) ** 2 + (food.y - camera.y) ** 2);
                if (dist < viewDist) {
                    food.draw();
                }
            }

            for (const p of particles) {
                const alpha = p.life / p.maxLife;
                ctx.fillStyle = `rgba(${p.color.r}, ${p.color.g}, ${p.color.b}, ${alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }

            const allSnakes = [player, ...bots].filter(s => s && !s.dead);
            for (const snake of allSnakes) {
                snake.draw();
            }

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            for (const snake of allSnakes) {
                snake.drawNameplate();
            }

            drawCustomCursor();
        }

        function gameLoop() {
            const now = performance.now();
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            update(dt);
            draw();

            requestAnimationFrame(gameLoop);
        }

        initGame();
        gameLoop();
    </script>
